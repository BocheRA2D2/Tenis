name: Build Android APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # BUILD MOBILE VERSION
      - name: Prepare Mobile Assets
        run: |
          rm -rf www
          mkdir -p www
          cp -r Mobile/* www/
          mkdir -p www/Shared
          cp -r Shared/js www/Shared/js
          cp "Firebase Config.txt" "Program.txt" www/

      - name: Configure Mobile App
        run: |
          sed -i 's/"appId": ".*"/"appId": "com.tenisv2.app"/' capacitor.config.json
          sed -i 's/"appName": ".*"/"appName": "Tenis"/' capacitor.config.json

      - name: Sync Mobile
        run: |
          npx cap add android || echo "Android folder exists"
          npx cap sync android

      - name: Build Mobile APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk ../TenisManager-Mobile.apk

      # BUILD TABLET VERSION
      - name: Prepare Tablet Assets
        run: |
          rm -rf www
          mkdir -p www
          cp -r PC/* www/
          mkdir -p www/Shared
          cp -r Shared/js www/Shared/js
          cp "Firebase Config.txt" "Program.txt" www/

      - name: Configure Tablet App
        run: |
          sed -i 's/"appId": ".*"/"appId": "com.tenisv2.tablet"/' capacitor.config.json
          sed -i 's/"appName": ".*"/"appName": "Tenis Tablet"/' capacitor.config.json

      - name: Sync Tablet
        run: |
          npx cap sync android

      - name: Build Tablet APK
        run: |
          cd android
          # We need to change the applicationId in build.gradle as well because Sync doesn't always update it if folder exists
          sed -i 's/applicationId ".*"/applicationId "com.tenisv2.tablet"/' app/build.gradle
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk ../TenisManager-Tablet.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: TenisManager-APKs
          path: |
            TenisManager-Mobile.apk
            TenisManager-Tablet.apk
