name: Build Android APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          # Default files to bundle
          cp -r Mobile/* www/ || true
          mkdir -p www/Shared
          cp -r Shared/js www/Shared/js || true
          cp "Firebase Config.txt" "Program.txt" www/ || true

      - name: Initialize Android Project
        run: |
          npx cap add android || echo "Android folder exists"
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TenisManager-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
